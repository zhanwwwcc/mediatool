[package]
name = "mediatool"
version = "1.0.0"
description = "媒体工具:媒体信息查看 + 快速裁剪"
edition = "2021"

[lib]
name = "mediatool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
