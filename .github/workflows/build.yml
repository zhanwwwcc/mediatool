name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 前置 job:创建(或复用)本次版本号的 Release,并输出其 id。
  # 后续构建 job 用 releaseId 直接上传资产,彻底避开并发抢建同名 tag 的竞态。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(sed -n 's/.*"version": "\([0-9][0-9.]*\)".*/\1/p' src-tauri/tauri.conf.json)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: 创建(或复用)Release 并输出 id
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          BODY="媒体信息查看 + 快速裁剪(不重编码、不播放、完全离线)。macOS 为 .dmg(Apple Silicon / Intel 各一),Windows 为 NSIS 安装器(.exe)。"
          # 1) 先确保 git tag 存在:POST /releases 在 tag 不存在时曾出现 CI 全绿却未建出 Release 的问题
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/refs" --method POST \
              -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "git tag ${TAG} 已创建"
          fi
          # 2) 创建(或复用)Release 并输出 id
          # 注意:必须用退出码判断。gh api 对 404 会把错误 JSON 打到 stdout,
          # 若用 `RID=$(... || true)` 会把错误 JSON 当成"已存在"而跳过创建(曾导致 v1.2.1/v1.2.2 未建出 Release)
          if gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' >/dev/null 2>&1; then
            RID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id')
            echo "Release ${TAG} 已存在,复用(id=${RID})"
          else
            RID=$(gh api "repos/${{ github.repository }}/releases" --method POST \
              -f "tag_name=${TAG}" -f "name=媒体工具 ${TAG}" -f "body=${BODY}" \
              --jq '.id')
            echo "Release ${TAG} 已创建(id=${RID})"
          fi
          echo "release_id=${RID}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # macOS Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖(Tauri CLI)
        run: npm install

      # ===== 按平台下载 ffmpeg / ffprobe,放入 Tauri resources 目录(不入 git 仓库)=====

      - name: 下载 ffmpeg/ffprobe(macOS Apple Silicon)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          mkdir -p src-tauri/resources
          curl -fsSL -o ffmpeg.zip https://www.osxexperts.net/ffmpeg9arm.zip
          curl -fsSL -o ffprobe.zip https://www.osxexperts.net/ffprobe9arm.zip
          unzip -j -o ffmpeg.zip -d src-tauri/resources
          unzip -j -o ffprobe.zip -d src-tauri/resources
          rm -f ffmpeg.zip ffprobe.zip
          # ad-hoc 签名,避免二进制被 macOS 拒绝执行
          xattr -dr com.apple.quarantine src-tauri/resources/ffmpeg src-tauri/resources/ffprobe || true
          codesign -s - src-tauri/resources/ffmpeg src-tauri/resources/ffprobe
          ls -la src-tauri/resources

      - name: 下载 ffmpeg/ffprobe(macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          mkdir -p src-tauri/resources
          curl -fsSL -o ffmpeg.zip https://www.osxexperts.net/ffmpeg80intel.zip
          curl -fsSL -o ffprobe.zip https://www.osxexperts.net/ffprobe80intel.zip
          unzip -j -o ffmpeg.zip -d src-tauri/resources
          unzip -j -o ffprobe.zip -d src-tauri/resources
          rm -f ffmpeg.zip ffprobe.zip
          xattr -dr com.apple.quarantine src-tauri/resources/ffmpeg src-tauri/resources/ffprobe || true
          codesign -s - src-tauri/resources/ffmpeg src-tauri/resources/ffprobe
          ls -la src-tauri/resources

      - name: 下载 ffmpeg/ffprobe(Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          Copy-Item ffmpeg-tmp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/resources/
          Copy-Item ffmpeg-tmp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe src-tauri/resources/
          Remove-Item ffmpeg.zip, ffmpeg-tmp -Recurse -Force
          Get-ChildItem src-tauri/resources

      # ===== 构建 + 发布 Release(macOS 出 .dmg,Windows 出 NSIS 安装器)=====

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: '媒体工具 v__VERSION__'
          releaseBody: '媒体信息查看 + 快速裁剪(不重编码、不播放、完全离线)。macOS 为 .dmg(Apple Silicon / Intel 各一),Windows 为 NSIS 安装器(.exe)。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
